name: Build and test binds

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main') && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-go:
    name: Go
    uses: ./.github/workflows/binds-go.yml

  build-js:
    name: JavaScript
    uses: ./.github/workflows/binds-js.yml
    # Reusable workflows do not inherit secrets; the tagged publish needs this.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-rs:
    name: Rust
    uses: ./.github/workflows/binds-rs.yml

  build-py:
    name: Python
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/binds-py.yml
