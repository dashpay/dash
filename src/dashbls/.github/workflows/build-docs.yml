name: Build docs

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pep503:
    name: Generate PEP503 index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate index
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python .github/scripts/build_simple_index.py --output _site

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6

    - name: Upload index
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v5
