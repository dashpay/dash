### Debugging/Testing options


# Output debug and trace logging (default: -nodebug, supplying <category>
# is optional). If <category> is not supplied or if <category> = 1,
# output all debug and trace logging. <category> can be: addrman,
# bench, blockstorage, chainlocks, cmpctblock, coindb, coinjoin,
# creditpool, ehf, estimatefee, gobject, http, i2p, instantsend,
# ipc, leveldb, libevent, llmq, llmq-dkg, llmq-sigs, mempool,
# mempoolrej, mnpayments, mnsync, net, netconn, proxy, prune, qt,
# rand, reindex, rpc, selectcoins, spork, tor, txreconciliation,
# validation, walletdb, zmq. This option can be specified multiple
# times to output multiple categories.
#debug=<category>

# Exclude debug and trace logging for a category. Can be used in
# conjunction with -debug=1 to output debug and trace logging for
# all categories except the specified category. This option can be
# specified multiple times to exclude multiple categories.
#debugexclude=<category>

# Disable governance validation (0-1, default: 0)
#disablegovernance=1

# Print help message with debugging options and exit
#help-debug=1

# Include IP addresses in debug output (default: 0)
#logips=1

# Always prepend a category and level (default: 0)
#loglevelalways=1

# Prepend debug output with name of the originating source location
# (source file, line number and function name) (default: 0)
#logsourcelocations=1

# Prepend debug output with timestamp (default: 1)
#logtimestamps=1

# Maximum total fees (in DASH) to use in a single wallet transaction;
# setting this too low may abort large transactions (default: 0.10)
#maxtxfee=<amt>

# Overrides minimum spork signers to change spork value. Only useful for
# regtest and devnet. Using this on mainnet or testnet will ban
# you.
#minsporkkeys=<n>

# Send trace/debug info to console (default: 1 when no -daemon. To disable
# logging to file, set -nodebuglogfile)
#printtoconsole=1

# Protocol version to report to other nodes
#pushversion=1

# Shrink debug.log file on client startup (default: 1 when no -debug)
#shrinkdebugfile=1

# Override spork address. Only useful for regtest and devnet. Using this
# on mainnet or testnet will ban you.
#sporkaddr=<dashaddress>

# Set the private key to be used for signing spork messages.
#sporkkey=<privatekey>

# Append comment to the user agent string
#uacomment=<cmt>


### Chain selection options


# Use the chain <chain> (default: main). Allowed values: main, test,
# devnet, regtest
#chain=<chain>

# Use devnet chain with provided name
#devnet=<name>

# The number of blocks with a higher than normal subsidy to mine at the
# start of a chain. Block after that height will have fixed subsidy
# base. (default: 0, devnet-only)
#highsubsidyblocks=<n>

# The factor to multiply the normal block subsidy by while in the
# highsubsidyblocks window of a chain (default: 1, devnet-only)
#highsubsidyfactor=<n>

# Override the default LLMQ type used for ChainLocks. Allows using
# ChainLocks with smaller LLMQs. (default: llmq_devnet,
# devnet-only)
#llmqchainlocks=<quorum name>

# Override the default LLMQ size for the LLMQ_DEVNET quorum (devnet-only)
#llmqdevnetparams=<size>:<threshold>

# Override the default LLMQ type used for InstantSendDIP0024. (default:
# llmq_devnet_dip0024, devnet-only)
#llmqinstantsenddip0024=<quorum name>

# Override the default LLMQ type used for EHF. (default: llmq_devnet,
# devnet-only)
#llmqmnhf=<quorum name>

# Override the default LLMQ type used for Platform. (default:
# llmq_devnet_platform, devnet-only)
#llmqplatform=<quorum name>

# The number of blocks that can be mined with the minimum difficulty at
# the start of a chain (default: 0, devnet-only)
#minimumdifficultyblocks=<n>

# Override the default PowTargetSpacing value in seconds (default: 2.5
# minutes, devnet-only)
#powtargetspacing=<n>

# Use the test chain. Equivalent to -chain=test
#testnet=1


### Node relay options


# Equivalent bytes per sigop in transactions for relay and mining
# (default: 20)
#bytespersigop=1

# Relay and mine data carrier transactions (default: 1)
#datacarrier=1

# Maximum size of data in data carrier transactions we relay and mine
# (default: 83)
#datacarriersize=1

# Fees (in DASH/kB) smaller than this are considered zero fee for
# relaying, mining and transaction creation (default: 0.00001)
#minrelaytxfee=<amt>

# Relay non-P2SH multisig (default: 1)
#permitbaremultisig=1

# Add 'forcerelay' permission to whitelisted inbound peers with default
# permissions. This will relay transactions even if the
# transactions were already in the mempool. (default: 0)
#whitelistforcerelay=1

# Add 'relay' permission to whitelisted inbound peers with default
# permissions. This will accept relayed transactions even when not
# relaying transactions (default: 1)
#whitelistrelay=1


### Block creation options


# Set maximum block size in bytes (default: 2000000)
#blockmaxsize=<n>

# Set lowest fee rate (in DASH/kB) for transactions to be included in
# block creation. (default: 0.00001)
#blockmintxfee=<amt>


### RPC server options


# Accept public REST requests (default: 0)
#rest=1

# Allow JSON-RPC connections from specified source. Valid values for <ip>
# are a single IP (e.g. 1.2.3.4), a network/netmask (e.g.
# 1.2.3.4/255.255.255.0), a network/CIDR (e.g. 1.2.3.4/24), all
# ipv4 (0.0.0.0/0), or all ipv6 (::/0). This option can be
# specified multiple times
#rpcallowip=<ip>

# Username and HMAC-SHA-256 hashed password for JSON-RPC connections. The
# field <userpw> comes in the format: <USERNAME>:<SALT>$<HASH>. A
# canonical python script is included in share/rpcuser. The client
# then connects normally using the
# rpcuser=<USERNAME>/rpcpassword=<PASSWORD> pair of arguments. This
# option can be specified multiple times
#rpcauth=<userpw>

# Bind to given address to listen for JSON-RPC connections. Do not expose
# the RPC server to untrusted networks such as the public internet!
# This option is ignored unless -rpcallowip is also passed. Port is
# optional and overrides -rpcport. Use [host]:port notation for
# IPv6. This option can be specified multiple times (default:
# 127.0.0.1 and ::1 i.e., localhost, or if -rpcallowip has been
# specified, 0.0.0.0 and :: i.e., all addresses)
#rpcbind=<addr>[:port]

# Location of the auth cookie. Relative paths will be prefixed by a
# net-specific datadir location. (default: data dir)
#rpccookiefile=<loc>

# List of comma-separated usernames for JSON-RPC external connections
#rpcexternaluser=<users>

# Password for JSON-RPC connections
#rpcpassword=<pw>

# Listen for JSON-RPC connections on <port> (default: 9998, testnet:
# 19998, devnet: 19798, regtest: 19898)
#rpcport=<port>

# Set the number of threads to service RPC calls (default: 4)
#rpcthreads=<n>

# Username for JSON-RPC connections
#rpcuser=<user>

# Set a whitelist to filter incoming RPC calls for a specific user. The
# field <whitelist> comes in the format: <USERNAME>:<rpc 1>,<rpc
# 2>,...,<rpc n>. If multiple whitelists are set for a given user,
# they are set-intersected. See -rpcwhitelistdefault documentation
# for information on default whitelist behavior.
#rpcwhitelist=<whitelist>

# Sets default behavior for rpc whitelisting. Unless rpcwhitelistdefault
# is set to 0, if any -rpcwhitelist is set, the rpc server acts as
# if all rpc users are subject to empty-unless-otherwise-specified
# whitelists. If rpcwhitelistdefault is set to 1 and no
# -rpcwhitelist is set, rpc server acts as if all rpc users are
# subject to empty whitelists.
#rpcwhitelistdefault=1

# Accept command line and JSON-RPC commands
#server=1


# [Sections]
# Most options will apply to all networks. To confine an option to a specific
# network, add it under the relevant section below.
#
# Note: If not specified under a network section, the options addnode, connect,
# port, bind, rpcport, rpcbind, and wallet will only apply to mainnet.

# Options for mainnet
[main]

# Options for testnet
[test]

# Options for regtest
[regtest]
