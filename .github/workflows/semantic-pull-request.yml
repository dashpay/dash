name: "Check PR title and description"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure which types are allowed (newline delimited).
          # Default: https://github.com/commitizen/conventional-commit-types
          # Our specific types/scopes (from https://github.com/dashpay/dash/blob/master/CONTRIBUTING.md#contributor-workflow)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            guix
            ci
            lint
            chore
            revert
            trivial
            backport
          # Configure which scopes are allowed (newline delimited).
          scopes: |
            consensus
            interfaces
            log
            mining
            net
            qt
            rest
            rpc
            scripts
            stats
            utils
            wallet
            zmq

      # Checkout the base branch (pull_request_target default). Safe: no untrusted
      # PR code is executed. The helper script and this workflow land together on
      # merge, so enforcement starts after merge — same as the workflow YAML itself.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Reject @username mentions in the PR description. Mentions are copied
      # into merge commits and re-notify people on merge/rebase/backport.
      # Body is passed via env (not shell interpolation) to avoid injection.
      - name: Check PR description for @mentions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/workflows/check_pr_description_mentions.py
