name: Check Merge Fast-Forward Only

permissions:
  contents: read

# Whether master can fast-forward is a property of the branch, not of any one
# PR, so check it when develop or a release branch moves. PR merge conflicts
# are already handled by GitHub and label-merge-conflicts.yml.
on:
  push:
    branches:
      - develop
      - 'v*.x'

jobs:
  check_merge:
    runs-on: ${{ vars.RUNNER_MERGE_CHECK || vars.DASH_LIGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check merge --ff-only
        run: |
          git fetch --no-tags origin master:master
          git checkout master
          git merge --ff-only "${GITHUB_SHA}"
