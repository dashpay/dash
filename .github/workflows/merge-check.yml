name: Check Merge Fast-Forward Only

permissions:
  contents: read
  statuses: write

concurrency:
  group: merge-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Check branch pushes to protect develop and release branches, refresh statuses
# for open PRs when their base moves, and check PR merge refs. PR merge
# conflicts are already handled by GitHub and label-merge-conflicts.yml.
on:
  push:
    branches:
      - develop
      - 'v*.x'
  pull_request_target: # zizmor: ignore[dangerous-triggers] fetches the PR head only to test a merge; runs no PR code
    branches:
      - develop
      - 'v*.x'
    types: [opened, synchronize, reopened, edited]

jobs:
  merge_check:
    runs-on: ${{ vars.DASH_LIGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Mark merge checks pending
        uses: actions/github-script@v8
        env:
          BASE_REF: ${{ github.ref_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PENDING_FILE: ${{ runner.temp }}/merge-check-pending
        with:
          script: |
            const fs = require('fs');
            const heads = new Set();
            if (context.eventName === 'push') {
              heads.add(context.sha);
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const pull of pulls) {
              const protectedBase = pull.base.ref === 'develop'
                || /^v.*\.x$/.test(pull.base.ref);
              const relevant = context.eventName === 'push'
                ? protectedBase
                : protectedBase && pull.head.sha === process.env.EVENT_HEAD_SHA;
              if (relevant) {
                heads.add(pull.head.sha);
              }
            }
            if (context.eventName === 'pull_request_target') {
              heads.add(process.env.EVENT_HEAD_SHA);
            }
            fs.writeFileSync(process.env.PENDING_FILE, `${[...heads].join('\n')}\n`);
            for (const sha of heads) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'pending',
                context: 'check_merge',
              });
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "noreply@example.com"

      - name: Check merge --ff-only
        id: merge_check
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+master:master"
          RESULTS_FILE="${RUNNER_TEMP}/merge-check-results"
          : > "${RESULTS_FILE}"

          check_pull_request() {
            local number="$1"
            local base_ref="$2"
            local head_sha="$3"
            local state=success
            local merge_sha

            git fetch --no-tags origin "+${base_ref}:base_branch"
            git fetch --no-tags origin "+pull/${number}/head:pr_head"
            if [[ "$(git rev-parse pr_head)" != "${head_sha}" ]]; then
              state=failure
            else
              git checkout --detach base_branch
              if git merge --no-edit --no-ff "${head_sha}"; then
                merge_sha="$(git rev-parse HEAD)"
                git checkout --detach master
                if ! git merge --ff-only "${merge_sha}"; then
                  state=failure
                fi
              else
                git merge --abort || git reset --hard base_branch
                state=failure
              fi
            fi
            printf '%s\t%s\t%s\n' "${number}" "${head_sha}" "${state}" >> "${RESULTS_FILE}"
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            branch_state=success
            git checkout --detach master
            if ! git merge --ff-only "${GITHUB_SHA}"; then
              branch_state=failure
            fi

            pull_requests="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.base.ref == "develop" or (.base.ref | test("^v.*\\.x$"))) | [.number, .base.ref, .head.sha] | @tsv')" || exit 1
            while IFS=$'\t' read -r number base_ref head_sha; do
              [[ -z "${number}" ]] && continue
              check_pull_request "${number}" "${base_ref}" "${head_sha}"
            done <<< "${pull_requests}"
            [[ "${branch_state}" == success ]]
          else
            pull_requests="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.sha == env.PR_HEAD_SHA and (.base.ref == "develop" or (.base.ref | test("^v.*\\.x$")))) | [.number, .base.ref, .head.sha] | @tsv')" || exit 1
            if [[ -z "${pull_requests}" ]]; then
              pull_requests="${PR_NUMBER}"$'\t'"${PR_BASE_REF}"$'\t'"${PR_HEAD_SHA}"
            fi
            while IFS=$'\t' read -r number base_ref head_sha; do
              [[ -z "${number}" ]] && continue
              check_pull_request "${number}" "${base_ref}" "${head_sha}"
            done <<< "${pull_requests}"
            if grep -q $'\tfailure$' "${RESULTS_FILE}"; then
              exit 1
            fi
          fi

      - name: Publish merge check statuses
        if: always() && !cancelled()
        uses: actions/github-script@v8
        env:
          RESULTS_FILE: ${{ runner.temp }}/merge-check-results
          PENDING_FILE: ${{ runner.temp }}/merge-check-pending
        with:
          script: |
            const fs = require('fs');
            const pending = new Set();
            const states = new Map();
            const addState = (sha, state) => {
              if (states.get(sha) === 'failure' || state === 'failure') {
                states.set(sha, 'failure');
              } else {
                states.set(sha, state);
              }
            };
            const stepState = '${{ steps.merge_check.outcome }}' === 'success'
              ? 'success'
              : 'failure';
            if (context.eventName === 'push') {
              addState(context.sha, stepState);
            }
            if (fs.existsSync(process.env.RESULTS_FILE)) {
              for (const line of fs.readFileSync(process.env.RESULTS_FILE, 'utf8').trim().split('\n')) {
                if (!line) continue;
                const [, sha, state] = line.split('\t');
                addState(sha, state);
              }
            }
            if (context.eventName === 'pull_request_target') {
              addState(context.payload.pull_request.head.sha, stepState);
            }
            if (fs.existsSync(process.env.PENDING_FILE)) {
              for (const sha of fs.readFileSync(process.env.PENDING_FILE, 'utf8').trim().split('\n')) {
                if (sha) pending.add(sha);
              }
            }
            if (pending.size === 0) {
              pending.add(context.eventName === 'push'
                ? context.sha
                : context.payload.pull_request.head.sha);
            }
            for (const sha of pending) {
              if (!states.has(sha)) {
                addState(sha, 'failure');
              }
            }
            for (const [sha, state] of states) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'check_merge',
              });
            }
