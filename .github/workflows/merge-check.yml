name: Check Merge Fast-Forward Only

permissions:
  contents: read
  statuses: write

# Check branch pushes to protect develop and release branches, and check PR
# merge refs so the required status is reported before a PR is merged. PR merge
# conflicts are already handled by GitHub and label-merge-conflicts.yml.
on:
  push:
    branches:
      - develop
      - 'v*.x'
  pull_request_target: # zizmor: ignore[dangerous-triggers] fetches the PR head only to test a merge; runs no PR code
    branches:
      - develop
      - 'v*.x'
    types: [opened, synchronize, reopened, edited]

jobs:
  merge_check:
    runs-on: ${{ vars.DASH_LIGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Git
        if: github.event_name == 'pull_request_target'
        run: |
          git config user.name "GitHub Action"
          git config user.email "noreply@example.com"

      - name: Check merge --ff-only
        id: merge_check
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin master:master
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            git fetch --no-tags origin "${PR_BASE_REF}:base_branch"
            git fetch --no-tags origin "pull/${PR_NUMBER}/head:pr_head"
            test "$(git rev-parse pr_head)" = "${PR_HEAD_SHA}"
            git checkout base_branch
            git merge --no-edit --no-ff "${PR_HEAD_SHA}"
            git checkout master
            git merge --ff-only base_branch
          else
            git checkout master
            git merge --ff-only "${GITHUB_SHA}"
          fi

      - name: Publish merge check status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          STATUS_STATE: ${{ steps.merge_check.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state="${STATUS_STATE}" \
            -f context='check_merge'
