name: Check Merge Fast-Forward Only

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: merge-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Check branch pushes to protect develop and release branches, refresh checks for
# open PRs when their base moves, and check PR merge refs. PR merge
# conflicts are already handled by GitHub and label-merge-conflicts.yml.
on:
  push:
    branches:
      - develop
      - 'v*.x'
  pull_request_target: # zizmor: ignore[dangerous-triggers] fetches PR heads only to test merges; runs no PR code
    types: [opened, synchronize, reopened, edited, closed]

jobs:
  merge_check:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.base.ref == 'develop' ||
      (startsWith(github.event.pull_request.base.ref, 'v') && endsWith(github.event.pull_request.base.ref, '.x')) ||
      github.event.action == 'edited' ||
      github.event.action == 'closed'
    runs-on: ${{ vars.DASH_LIGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Mark merge checks pending
        uses: actions/github-script@v8
        env:
          PENDING_FILE: ${{ runner.temp }}/merge-check-pending
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const heads = new Set();
            if (context.eventName === 'push') {
              heads.add(context.sha);
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const pull of pulls) {
              const protectedBase = pull.base.ref === 'develop'
                || /^v.*\.x$/.test(pull.base.ref);
              const relevant = protectedBase;
              if (relevant) {
                heads.add(pull.head.sha);
              }
            }
            if (context.eventName === 'pull_request_target'
              && context.payload.action !== 'closed') {
              heads.add(process.env.EVENT_HEAD_SHA);
            }

            const checkIds = new Map();
            const writePendingFile = () => {
              fs.writeFileSync(process.env.PENDING_FILE,
                [...heads].map((sha) => `${sha}\t${checkIds.get(sha) || ''}`).join('\n') + '\n');
            };
            writePendingFile();
            for (const sha of heads) {
              const existing = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: 'check_merge',
                per_page: 100,
              });
              const params = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'check_merge',
                external_id: `${process.env.GITHUB_RUN_ID}:${sha}`,
                status: 'in_progress',
                started_at: new Date().toISOString(),
                output: {
                  title: 'Checking merge fast-forward status',
                  summary: 'The merge check is in progress.',
                },
              };
              const check = existing.length
                ? await github.rest.checks.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    check_run_id: existing[0].id,
                    ...params,
                  })
                : await github.rest.checks.create({ ...params, head_sha: sha });
              checkIds.set(sha, check.data.id);
              writePendingFile();
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "noreply@example.com"

      - name: Check merge --ff-only
        id: merge_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout --detach HEAD
          git fetch --no-tags origin "+master:master"
          RESULTS_FILE="${RUNNER_TEMP}/merge-check-results"
          SNAPSHOTS_FILE="${RUNNER_TEMP}/merge-check-base-snapshots"
          STALE_FILE="${RUNNER_TEMP}/merge-check-stale"
          : > "${RESULTS_FILE}"
          : > "${SNAPSHOTS_FILE}"
          : > "${STALE_FILE}"
          declare -A base_snapshots

          record_base_snapshot() {
            local base_ref="$1"
            local base_sha
            if [[ -z "${base_snapshots[${base_ref}]+x}" ]]; then
              base_sha="$(git ls-remote origin "refs/heads/${base_ref}" | awk '{print $1}')"
              base_snapshots["${base_ref}"]="${base_sha}"
              printf '%s\t%s\n' "${base_ref}" "${base_sha}" >> "${SNAPSHOTS_FILE}"
            fi
          }

          check_pull_request() {
            local number="$1"
            local base_ref="$2"
            local head_sha="$3"
            local state=success
            local merge_sha

            record_base_snapshot "${base_ref}"
            git fetch --no-tags origin "+${base_ref}:base_branch"
            git fetch --no-tags origin "+pull/${number}/head:pr_head"
            if [[ "$(git rev-parse pr_head)" != "${head_sha}" ]]; then
              state=failure
            else
              git checkout --detach base_branch
              if git merge --no-edit --no-ff "${head_sha}"; then
                merge_sha="$(git rev-parse HEAD)"
                git checkout --detach master
                if ! git merge --ff-only "${merge_sha}"; then
                  state=failure
                fi
              else
                git merge --abort || git reset --hard base_branch
                state=failure
              fi
            fi
            printf '%s\t%s\t%s\n' "${number}" "${head_sha}" "${state}" >> "${RESULTS_FILE}"
          }

          check_failed=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            branch_state=success
            git checkout --detach master
            if ! git merge --ff-only "${GITHUB_SHA}"; then
              branch_state=failure
            fi

            pull_requests="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.base.ref == "develop" or (.base.ref | test("^v.*\\.x$"))) | [.number, .base.ref, .head.sha] | @tsv')" || exit 1
            while IFS=$'\t' read -r number base_ref head_sha; do
              [[ -z "${number}" ]] && continue
              check_pull_request "${number}" "${base_ref}" "${head_sha}"
            done <<< "${pull_requests}"
            if [[ "${branch_state}" != success ]]; then
              check_failed=true
            fi
          else
            pull_requests="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.base.ref == "develop" or (.base.ref | test("^v.*\\.x$"))) | [.number, .base.ref, .head.sha] | @tsv')" || exit 1
            while IFS=$'\t' read -r number base_ref head_sha; do
              [[ -z "${number}" ]] && continue
              check_pull_request "${number}" "${base_ref}" "${head_sha}"
            done <<< "${pull_requests}"
            if grep -q $'\tfailure$' "${RESULTS_FILE}"; then
              check_failed=true
            fi
          fi

          while IFS=$'\t' read -r base_ref base_sha; do
            [[ -z "${base_ref}" ]] && continue
            current_sha="$(git ls-remote origin "refs/heads/${base_ref}" | awk '{print $1}')"
            if [[ "${current_sha}" != "${base_sha}" ]]; then
              echo true > "${STALE_FILE}"
            fi
          done < "${SNAPSHOTS_FILE}"
          if [[ "${check_failed}" == true ]]; then
            exit 1
          fi

      - name: Publish merge check runs
        if: always() && !cancelled()
        uses: actions/github-script@v8
        env:
          RESULTS_FILE: ${{ runner.temp }}/merge-check-results
          PENDING_FILE: ${{ runner.temp }}/merge-check-pending
          STALE_FILE: ${{ runner.temp }}/merge-check-stale
        with:
          script: |
            const fs = require('fs');
            const checkIds = new Map();
            const pending = new Set();
            const states = new Map();
            const addState = (sha, state) => {
              if (states.get(sha) === 'failure' || state === 'failure') {
                states.set(sha, 'failure');
              } else {
                states.set(sha, state);
              }
            };
            const stepState = '${{ steps.merge_check.outcome }}' === 'success'
              ? 'success'
              : 'failure';
            if (fs.existsSync(process.env.STALE_FILE)
              && fs.readFileSync(process.env.STALE_FILE, 'utf8').trim() === 'true') {
              if (fs.existsSync(process.env.PENDING_FILE)) {
                for (const line of fs.readFileSync(process.env.PENDING_FILE, 'utf8').trim().split('\n')) {
                  if (!line) continue;
                  const [, checkId] = line.split('\t');
                  if (!checkId) continue;
                  await github.rest.checks.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    check_run_id: Number(checkId),
                    status: 'completed',
                    conclusion: 'failure',
                    completed_at: new Date().toISOString(),
                    output: {
                      title: 'Merge check superseded',
                      summary: 'The protected base changed during validation; a newer run must replace this result.',
                    },
                  });
                }
              }
              return;
            }
            const closed = context.eventName === 'pull_request_target'
              && context.payload.action === 'closed';
            const targetIsProtected = context.eventName === 'pull_request_target'
              && (context.payload.pull_request.base.ref === 'develop'
                || /^v.*\.x$/.test(context.payload.pull_request.base.ref));
            if (context.eventName === 'push') {
              addState(context.sha, stepState);
            }
            if (fs.existsSync(process.env.RESULTS_FILE)) {
              for (const line of fs.readFileSync(process.env.RESULTS_FILE, 'utf8').trim().split('\n')) {
                if (!line) continue;
                const [, sha, state] = line.split('\t');
                addState(sha, state);
              }
            }
            if (targetIsProtected && !closed
              && !states.has(context.payload.pull_request.head.sha)) {
              addState(context.payload.pull_request.head.sha, stepState);
            }
            if (fs.existsSync(process.env.PENDING_FILE)) {
              for (const line of fs.readFileSync(process.env.PENDING_FILE, 'utf8').trim().split('\n')) {
                if (!line) continue;
                const [sha, checkId] = line.split('\t');
                pending.add(sha);
                if (checkId) checkIds.set(sha, Number(checkId));
              }
            }
            if (pending.size === 0 && !closed) {
              pending.add(context.eventName === 'push'
                ? context.sha
                : context.payload.pull_request.head.sha);
            }
            for (const sha of pending) {
              if (!states.has(sha)) {
                addState(sha, 'failure');
              }
            }
            for (const [sha, state] of states) {
              const params = {
                name: 'check_merge',
                status: 'completed',
                conclusion: state,
                completed_at: new Date().toISOString(),
                output: {
                  title: state === 'success'
                    ? 'Merge fast-forward check passed'
                    : 'Merge fast-forward check failed',
                  summary: state === 'success'
                    ? 'The protected base can fast-forward to the checked commit.'
                    : 'The protected base cannot fast-forward to the checked commit.',
                },
              };
              const checkId = checkIds.get(sha);
              if (checkId) {
                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: checkId,
                  ...params,
                });
              } else {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...params,
                  head_sha: sha,
                });
              }
            }
