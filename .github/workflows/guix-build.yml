name: Guix Build

permissions:
  contents: read

on:
  pull_request_target:
    types: [labeled]
  push:
  schedule:
    # Run weekly at 3 AM UTC on Sunday on the default branch
    - cron: '0 3 * * 0'

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    if: |
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || vars.RUN_GUIX_ON_ALL_PUSH == 'true')) ||
      github.event_name == 'schedule'
    permissions:
      contents: read
      packages: write
    outputs:
      path: ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-guix-builder:${{ steps.prepare.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: dash
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Commit variables
        id: prepare
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "host_user_id=$(id -u)" >> "${GITHUB_OUTPUT}"
          echo "host_group_id=$(id -g)" >> "${GITHUB_OUTPUT}"
          BRANCH_NAME="$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image-tag=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"
          echo "repo-name=${REPO_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/dash
          build-args: |
            USER_ID=${{ steps.prepare.outputs.host_user_id }}
            GROUP_ID=${{ steps.prepare.outputs.host_group_id }}
          build-contexts: |
            docker_root=${{ github.workspace }}/dash/contrib/containers/guix
          file: ./dash/contrib/containers/guix/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-guix-builder:${{ steps.prepare.outputs.image-tag }}
            ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-guix-builder:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.prepare.outputs.repo-name }}/dashcore-guix-builder:latest
          cache-to: type=inline,mode=max

  resolve-pr-image:
    if: |
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.labels.*.name, 'guix-build')
    runs-on: ubuntu-24.04-arm
    permissions: {}
    outputs:
      path: ${{ steps.resolve.outputs.path }}
    steps:
      - name: Select trusted Guix builder
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "path=ghcr.io/${REPOSITORY,,}/dashcore-guix-builder:${DEFAULT_BRANCH,,}" >> "${GITHUB_OUTPUT}"

  build-pr:
    needs: resolve-pr-image
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/guix-build-worker.yml
    with:
      source-ref: ${{ github.event.pull_request.head.sha }}
      container-path: ${{ needs.resolve-pr-image.outputs.path }}
      trusted: false

  build-trusted:
    needs: build-image
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/guix-build-worker.yml
    with:
      source-ref: ${{ github.sha }}
      container-path: ${{ needs.build-image.outputs.path }}
      trusted: true
