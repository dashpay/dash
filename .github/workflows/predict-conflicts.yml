name: "Check Potential Conflicts"

# A scheduled run is not attached to any PR, so a slow or cancelled run never
# shows up in a PR's checks. Each run rechecks every open PR.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write # PR conversation comments use the Issues API
  # Enforce other not needed permissions are off
  actions: none
  checks: none
  deployments: none
  packages: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  predict_conflicts:
    # Forks also run scheduled workflows.
    if: github.repository == 'dashpay/dash'
    runs-on: ${{ vars.RUNNER_PREDICT_CONFLICTS || vars.DASH_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: predict-conflicts
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Find conflicting PRs and update advisory comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/workflows/handle_potential_conflicts.py
