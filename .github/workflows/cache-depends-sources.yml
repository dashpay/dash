name: Cache depends sources

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label to use"
        required: false
        type: string
        default: ubuntu-24.04-arm
  schedule:
    # Run daily at 6 AM UTC on the default branch to keep cache warm
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  cache-sources:
    name: Cache depends sources
    # Intentionally keep scheduled cache warming on GitHub-hosted ARM runners.
    # Blacksmith caches are expected to persist long enough without a warmup cron.
    # build.yml passes its pre-lint runner, which may be self-hosted; the cache
    # key does not name the runner, so any arch can fill it.
    runs-on: ${{ inputs.runs-on || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # v2: caches from before the Platform GUI step below lack its sources.
      - name: Check for cached sources
        id: cache-check
        uses: actions/cache@v5
        with:
          path: depends/sources
          key: depends-sources-v2-${{ hashFiles('depends/packages/*') }}
          restore-keys: depends-sources-v2-
          lookup-only: true

      - name: Download sources
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: make -C depends download

      # The linux64_platform_gui depends job runs on x86_64, but this runner
      # may not: name the build machine, since the Rust toolchain and protoc
      # archives are chosen by it. download-linux would not pass BUILD on.
      - name: Download Platform GUI sources for x86_64 Linux
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: make -C depends download-one PLATFORM_GUI=1 BUILD=x86_64-pc-linux-gnu HOST=x86_64-unknown-linux-gnu
